name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build without signing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/NeteaseGlassBuild"
          xcodebuild \
            -project NeteaseGlass.xcodeproj \
            -scheme NeteaseGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NeteaseGlass.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/NeteaseGlass-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/NeteaseGlass-unsigned.ipa"
          test -s "$RUNNER_TEMP/NeteaseGlass-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseGlass-unsigned-ipa
          path: ${{ runner.temp }}/NeteaseGlass-unsigned.ipa
          if-no-files-found: error
